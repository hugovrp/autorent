<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

			<h:panelGroup rendered="#{not sessaoMB.logado}">

					<h:link outcome="login" value="Entrar" />
					 ou
					<h:link outcome="cadastro" value="criar uma conta" />.
				</p>
			</h:panelGroup>
			<h:panelGroup rendered="#{sessaoMB.logado}">

					Olá, #{sessaoMB.usuario.nome}!

				</p>
